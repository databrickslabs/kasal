version: 1
name: "kasal"
description: "An app helps you build agent workflow"
resource_specs:
  - name: sql-warehouse
    description: SQL warehouse used for trace queries and Databricks SQL operations.
    sql_warehouse_spec:
      permission: CAN_USE
  - name: volume
    description: Unity Catalog volume for generated files. Its parent catalog and schema also provide the namespace for isolated MLflow trace tables; the app requires separate table privileges in that schema.
    uc_securable_spec:
      securable_type: VOLUME
      permission: WRITE_VOLUME
  - name: serving-endpoint
    description: Chat-capable serving endpoint used by default for Chat and builder prompts.
    serving_endpoint_spec:
      permission: CAN_QUERY
# The public Marketplace AppManifest resource_specs schema does not yet expose
# a database/postgres spec. Add a Database app resource with key "lakebase" and
# permission CAN_CONNECT_AND_CREATE in the installation's resource selection.
# Without it Kasal runs on the container's SQLite file; set
# KASAL_REQUIRE_LAKEBASE_RESOURCE to 'true' in app.yaml to refuse that.
# Keep user_api_scopes equal to get_desired_oauth_scopes() in src/deploy.py, in the
# same order; tests/unit/test_deploy_scopes.py fails when the two lists differ.
user_api_scopes:
  - "sql"
  - "genie"
  - "postgres"
  - "model-serving"
  - "catalog.catalogs:read"
  - "catalog.schemas:read"
  - "catalog.tables:read"
  - "catalog.connections"
  - "files"
  - "ai-gateway"
  - "vector-search"
  - "workspace.workspace"
  - "mcp.external"
  - "mcp.functions"
