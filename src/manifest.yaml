version: 1
name: "kasal"
description: "An app helps you build agent workflow"
resource_specs:
  - name: sql-warehouse
    description: SQL warehouse used for trace queries and Databricks SQL operations.
    sql_warehouse_spec:
      permission: CAN_USE
  - name: mlflow-experiment
    description: Installation experiment with Unity Catalog trace storage. Kasal derives the storage namespace and creates separate personal-space and teamspace trace destinations.
    experiment_spec:
      permission: CAN_READ
  - name: output-volume
    description: Unity Catalog volume for generated files. Kasal separates outputs by teamspace.
    uc_securable_spec:
      securable_type: VOLUME
      permission: WRITE_VOLUME
  - name: default-model
    description: Chat-capable serving endpoint used by default for Chat and builder prompts.
    serving_endpoint_spec:
      permission: CAN_QUERY
  - name: embedding-model
    description: 1024-dimensional embedding endpoint for memory and knowledge (for example databricks-gte-large-en). Keep the same embedding model for existing data.
    serving_endpoint_spec:
      permission: CAN_QUERY
  - name: encryption-key
    description: Persistent Fernet encryption key secret. Reuse the existing key on upgrades.
    secret_spec:
      permission: READ
# The public Marketplace AppManifest resource_specs schema does not yet expose
# a database/postgres spec. Add a Database app resource with key "lakebase" and
# permission CAN_CONNECT_AND_CREATE in the installation's resource selection.
# app.yaml requires that binding, so an incomplete install cannot deploy using SQLite.
user_api_scopes:
  - "sql"
  - "sql.alerts"
  - "sql.alerts-legacy"
  - "sql.dashboards"
  - "sql.data-sources"
  - "sql.dbsql-permissions"
  - "sql.queries"
  - "sql.queries-legacy"
  - "sql.query-history"
  - "sql.statement-execution"
  - "sql.warehouses"
  - "vectorsearch.vector-search-endpoints"
  - "vectorsearch.vector-search-indexes"
  - "serving.serving-endpoints"
  - "files.files"
  - "dashboards.genie"
