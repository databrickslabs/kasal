name: Code Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to full commit SHAs (the comment names the release);
# Dependabot (.github/dependabot.yml) proposes the bumps.

jobs:
  backend-tests:
    name: Backend tests (+ coverage report)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: src/backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: '3.11'
          enable-cache: true
      - run: uv sync --frozen
      # Coverage is REPORT-ONLY: there is no fail_under yet. Follow-up: set
      # [tool.coverage.report] fail_under in src/backend/pyproject.toml from
      # the total this job first reports, then ratchet it upwards.
      - name: Tests with coverage
        run: uv run python run_tests.py --parallel 2 --skip-lint --coverage
      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-coverage
          path: src/backend/coverage.xml
          if-no-files-found: warn
          retention-days: 14

  # Independent of the tests, so a PR with a failing test still gets
  # formatting / lint / typing / architecture feedback in the same run.
  backend-lint:
    name: Backend format, lint, typing baseline, architecture
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src/backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: '3.11'
          enable-cache: true
      - run: uv sync --frozen
      - name: black, isort, ruff, mypy baseline, import-linter
        run: uv run python run_tests.py --lint-only

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm ci
      - run: npm run test:run
      - run: npm run lint
      - run: npm run build

  # Coverage is a separate, non-blocking job: the test gate above stays exactly
  # as it was, and v8 instrumentation slows the suite enough that some
  # interaction tests can hit the 10s per-test timeout (seen locally), which
  # must not turn the required check red.
  #
  # REPORT-ONLY: VITEST_COVERAGE_REPORT_ONLY=1 drops the per-path 100%
  # thresholds in vitest.config.ts, which the code does not meet today (~85-90%
  # on the chat globs). Follow-up: set those floors from this job's first
  # artifact, remove the env switch, then drop continue-on-error.
  frontend-coverage:
    name: Frontend coverage report
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    defaults:
      run:
        working-directory: src/frontend
    env:
      VITEST_COVERAGE_REPORT_ONLY: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm ci
      - name: Tests with coverage
        run: >-
          npx vitest run --coverage --testTimeout=30000
          --coverage.reporter=text-summary
          --coverage.reporter=json-summary
          --coverage.reporter=html
      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-coverage
          path: src/frontend/coverage/
          if-no-files-found: warn
          retention-days: 14
