name: Secret Scan

# gitleaks over the commits a change introduces (full history on the weekly
# run). The repo mentions a secret-scan pre-commit hook, but that is a
# per-developer setting; this is the guarantee.
#
# Runs the gitleaks CLI directly (pinned version + SHA-256) instead of
# gitleaks/gitleaks-action, which needs a paid licence key for
# organisation-owned repositories.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * 1" # Mondays 05:00 UTC, whole history
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb # linux_x64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "/tmp/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tarball"
          echo "${GITLEAKS_SHA256}  /tmp/$tarball" | sha256sum --check -
          tar -xzf "/tmp/$tarball" -C /tmp gitleaks
          /tmp/gitleaks version
      # Gating: PRs and pushes scan only the commits they add. The full-history
      # scan (schedule / manual) is REPORT-ONLY for now: at introduction it
      # found 150 historical hits (104 generic-api-key, 40 curl-auth-header,
      # 4 private-key, 2 jwt) across 51 paths. The ones sampled were test
      # fixtures and doc placeholders, but they have not all been reviewed.
      # Follow-up: triage them, rotate anything real, record the rest in a
      # .gitleaksignore (fingerprints, no secret values), then drop this
      # continue-on-error so the weekly scan gates too.
      - name: Scan
        continue-on-error: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # PRs and pushes: only the new commits. Schedule/dispatch (or a push
          # that created the branch, where "before" is all zeros): everything.
          range=""
          if [ "$EVENT" = "pull_request" ]; then
            range="${PR_BASE}..HEAD"
          elif [ "$EVENT" = "push" ] && [ -n "$PUSH_BEFORE" ] \
               && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            range="${PUSH_BEFORE}..HEAD"
          fi
          args=(git --redact --no-banner --exit-code 1)
          if [ -n "$range" ]; then
            args+=(--log-opts="$range")
          fi
          /tmp/gitleaks "${args[@]}" .
