# Dependency update PRs. Weekly, grouped, so a week's minor/patch bumps arrive
# as one PR per ecosystem instead of dozens.
#
# Major versions are NOT proposed as version updates (uv, npm): each one is a
# migration to plan, not a weekly PR — the first run on the default branch
# opened 11 of them at once. The uv updater only refreshes uv.lock
# (lockfile-only) instead of raising pyproject.toml floors, and litellm,
# crewai* and mcp are left to the manual bump process (proxy hold, artifact
# and hash verification — see the comments on their pins in pyproject.toml).
#
# CVE detection itself runs in .github/workflows/dependency-audit.yml; this
# file is about getting the fixes proposed.
#
# cooldown: a release must be 7 days old before it is proposed, matching the
# internal registry proxies' hold (litellm 1.82.7/1.82.8 and 1.107.0 were
# malicious and pulled within hours). Version updates only — security updates
# are not delayed.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns: ["*"]

  # Python: src/backend/pyproject.toml + uv.lock (the only Python manifest).
  - package-ecosystem: uv
    directory: /src/backend
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    versioning-strategy: lockfile-only
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "litellm"
      - dependency-name: "crewai*"
      - dependency-name: "mcp"
      # 2.1 is a deliberate upgrade (stricter Row typing: 50 new mypy errors in
      # db/ and repositories/); stay on the 2.0 line until it is planned.
      - dependency-name: "sqlalchemy"
        versions: [">=2.1"]
    groups:
      python-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /src/frontend
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
